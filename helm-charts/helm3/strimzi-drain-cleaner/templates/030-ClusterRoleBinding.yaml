{{- if .Values.serviceAccount.create -}}
{{- range (.Values.drainNamespaces | default (list "")) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if . }}RoleBinding{{ else }}ClusterRoleBinding{{ end }}
metadata:
  name: {{ include "strimzi-drain-cleaner.serviceAccountName" $ }}{{ if . }}-drain{{ end }}
  labels:
    {{- include "strimzi-drain-cleaner.labels" $ | nindent 4 }}
  {{- if . }}
  namespace: {{ . }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "strimzi-drain-cleaner.serviceAccountName" $ }}
    namespace: {{ default $.Release.Namespace $.Values.namespace.name }}
roleRef:
  kind: {{ if . }}Role{{ else }}ClusterRole{{ end }}
  name: {{ include "strimzi-drain-cleaner.serviceAccountName" $ }}{{ if . }}-drain{{ end }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
