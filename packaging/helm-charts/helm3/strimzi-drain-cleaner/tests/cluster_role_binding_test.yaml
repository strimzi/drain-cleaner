suite: strimzi drain cleaner cluster role binding
release:
  name: strimzi-drain-cleaner
  namespace: strimzi-drain-cleaner
templates:
  - 030-ClusterRoleBinding.yaml
tests:
  - it: should render the ClusterRoleBinding by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: strimzi-drain-cleaner
      - notExists:
          path: metadata.namespace
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: strimzi-drain-cleaner
              namespace: strimzi-drain-cleaner
      - equal:
          path: roleRef
          value:
            kind: ClusterRole
            name: strimzi-drain-cleaner
            apiGroup: rbac.authorization.k8s.io

  - it: should bind the service account from the custom namespace
    set:
      namespace.name: my-namespace
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: subjects[0].namespace
          value: my-namespace

  - it: should not render anything when the service account is not created
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a RoleBinding in each drain namespace instead of the ClusterRoleBinding
    set:
      drainNamespaces:
        - ns-a
        - ns-b
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.name
          value: strimzi-drain-cleaner-drain
      - equal:
          path: metadata.namespace
          value: ns-a
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: ns-b
        documentIndex: 1
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: strimzi-drain-cleaner
              namespace: strimzi-drain-cleaner
      - equal:
          path: roleRef
          value:
            kind: Role
            name: strimzi-drain-cleaner-drain
            apiGroup: rbac.authorization.k8s.io

  - it: should not render anything for drain namespaces when the service account is not created
    set:
      serviceAccount.create: false
      drainNamespaces:
        - ns-a
    asserts:
      - hasDocuments:
          count: 0
