suite: strimzi drain cleaner validating webhook configuration
release:
  name: strimzi-drain-cleaner
  namespace: strimzi-drain-cleaner
templates:
  - 070-ValidatingWebhookConfiguration.yaml
tests:
  - it: should render the ValidatingWebhookConfiguration with the default name
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ValidatingWebhookConfiguration
      - equal:
          path: metadata.name
          value: strimzi-drain-cleaner
      - notExists:
          path: metadata.namespace
      - notExists:
          path: webhooks[0].namespaceSelector

  - it: should use the custom webhook name without changing the service or certificate references
    set:
      webhook.name: my-drain-cleaner-webhook
      namespace.name: my-namespace
    asserts:
      - equal:
          path: metadata.name
          value: my-drain-cleaner-webhook
      - notExists:
          path: metadata.namespace
      - equal:
          path: webhooks[0].name
          value: strimzi-drain-cleaner.strimzi.io
      - equal:
          path: webhooks[0].clientConfig.service
          value:
            namespace: my-namespace
            name: strimzi-drain-cleaner
            path: /drainer
            port: 443
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: my-namespace/strimzi-drain-cleaner

  - it: should limit webhook calls to the configured drain namespaces
    set:
      drainNamespaces:
        - ns-a
        - ns-b
    asserts:
      - equal:
          path: webhooks[0].namespaceSelector
          value:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [ns-a, ns-b]

  - it: should preserve a custom namespace selector when no drain namespaces are configured
    set:
      drainNamespaces: []
      webhook.namespaceSelector:
        matchLabels:
          team: kafka
    asserts:
      - equal:
          path: webhooks[0].namespaceSelector
          value:
            matchLabels:
              team: kafka

  - it: should use only the custom namespace selector when drain namespaces are configured
    set:
      drainNamespaces: [ns-a]
      webhook.namespaceSelector:
        matchLabels:
          team: kafka
        matchExpressions:
          - key: environment
            operator: Exists
    asserts:
      - equal:
          path: webhooks[0].namespaceSelector
          value:
            matchLabels:
              team: kafka
            matchExpressions:
              - key: environment
                operator: Exists

  - it: should use an explicitly empty selector instead of the drain namespace list
    set:
      drainNamespaces: [ns-a]
      webhook.namespaceSelector: {}
    asserts:
      - equal:
          path: webhooks[0].namespaceSelector
          value: {}
