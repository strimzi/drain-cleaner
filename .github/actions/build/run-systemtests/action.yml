name: "Run Drain Cleaner System Tests"
description: "Run drain-cleaner system tests with Kind cluster"

inputs:
  architecture:
    description: "Architecture to test"
    required: false
    default: "amd64"
  runnerArch:
    description: "Architecture of GitHub runner"
    required: false
    default: "amd64"
  installType:
    description: "Installation type (Bundle or Helm)"
    required: false
    default: "Bundle"

runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: strimzi/github-actions/.github/actions/dependencies/setup-java@52b17c19f3687e37b47c9c64696b96f28f53625b # v2.3
      with:
        javaVersion: "21"

    - name: Setup Kind
      uses: strimzi/github-actions/.github/actions/dependencies/setup-kind@52b17c19f3687e37b47c9c64696b96f28f53625b # v2.3
      with:
        architecture: ${{ inputs.architecture }}

    - name: Download container artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: containers-drain-cleaner-${{ inputs.architecture }}.tar
        path: ./

    - name: Extract container archive
      shell: bash
      run: tar -xvf containers-drain-cleaner-${{ inputs.architecture }}.tar

    - name: Load, tag and push containers to local registry
      shell: bash
      run: |
        make docker_load
        make docker_tag
        make docker_push
      env:
        DOCKER_ARCHITECTURE: ${{ inputs.architecture }}
        BUILD_TAG: latest
        DOCKER_ORG: strimzi
        DOCKER_TAG: latest

    - name: Run systemtests - ${{ inputs.installType }} installation
      shell: bash
      run: mvn verify -B -Psystemtest
      env:
        DOCKER_ORG: strimzi
        DOCKER_TAG: latest-${{ inputs.architecture }}
        DC_INSTALL_TYPE: ${{ inputs.installType }}
        TEST_LOG_DIR: systemtest/target/logs

    - name: Publish test logs
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: systemtest-logs-${{ inputs.architecture }}-${{ inputs.installType }}
        path: systemtest/target/logs