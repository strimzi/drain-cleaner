name: "Run Drain Cleaner System Tests"
description: "Run drain-cleaner system tests with Kind cluster"

inputs:
  architecture:
    description: "Architecture to test"
    required: false
    default: "amd64"
  runnerArch:
    description: "Architecture of GitHub runner"
    required: false
    default: "amd64"
  installType:
    description: "Installation type (Bundle or Helm)"
    required: false
    default: "Bundle"

runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: strimzi/github-actions/.github/actions/dependencies/setup-java@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
      with:
        javaVersion: "21"

    - name: Setup Kind
      uses: strimzi/github-actions/.github/actions/dependencies/setup-kind@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
      with:
        architecture: ${{ inputs.architecture }}

    - name: Download container artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: containers-drain-cleaner-${{ inputs.architecture }}.tar
        path: ./

    - name: Extract container archive
      shell: bash
      run: tar -xvf containers-drain-cleaner-${{ inputs.architecture }}.tar

    - name: Load, tag and push containers to local registry
      shell: bash
      run: |
        make docker_load
        make docker_tag
        make docker_push
      env:
        DOCKER_ARCHITECTURE: ${{ inputs.architecture }}
        BUILD_TAG: latest
        DOCKER_ORG: strimzi
        DOCKER_TAG: latest

    - name: Run systemtests - ${{ inputs.installType }} installation
      shell: bash
      run: mvn verify -B -Psystemtest
      env:
        DOCKER_ORG: strimzi
        DOCKER_TAG: latest-${{ inputs.architecture }}
        DC_INSTALL_TYPE: ${{ inputs.installType }}
        TEST_LOG_DIR: systemtest/target/logs

    - name: Publish test logs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: systemtest-logs-${{ inputs.architecture }}-${{ inputs.installType }}
        path: systemtest/target/logs