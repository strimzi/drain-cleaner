name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release Version (e.g., 1.5.0 for GA or 1.5.0-rc1 for RC)'
        required: true
        type: string
      useSuffix:
        description: 'Build suffixed images (e.g., 1.5.0-0 before final 1.5.0)'
        required: true
        type: boolean
        default: true
      releaseSuffix:
        description: 'Release Suffix (e.g., 0 for 1.5.0-0, used only if useSuffix is true)'
        required: true
        type: string
        default: '0'
      sourceBuildRunId:
        description: 'GitHub Actions Run ID of the source build (find in Actions tab URL)'
        required: true
        type: string

# Declare default permissions as read only
permissions:
  contents: read

jobs:
  prepare-release-artifacts:
    name: Prepare Release Artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: strimzi/github-actions/.github/actions/dependencies/setup-java@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          javaVersion: "21"

      - uses: strimzi/github-actions/.github/actions/dependencies/install-helm@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          helmVersion: "v3.16.0"

      - uses: strimzi/github-actions/.github/actions/build/release-artifacts@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          releaseVersion: ${{ inputs.releaseVersion }}
          artifactSuffix: "drain-cleaner"

  # Push Java artifacts to GHCR for long-term storage (for CVE rebuilds)
  push-java-artifacts-to-ghcr:
    name: Push Java artifacts to GHCR
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Download strimzi binaries from source build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-drain-cleaner.tar
          run-id: ${{ inputs.sourceBuildRunId }}
          github-token: ${{ github.token }}

      - name: Login to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Java artifacts to GHCR
        run: |
          oras push ghcr.io/${{ env.REPOSITORY }}/binaries-drain-cleaner:${{ env.TAG }} binaries-drain-cleaner.tar:application/x-tar
        env:
          TAG: ${{ inputs.releaseVersion }}-${{ inputs.sourceBuildRunId }}
          REPOSITORY: "strimzi"

  push-containers-with-suffix:
    name: Push Containers with suffix
    needs:
      - prepare-release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') && inputs.useSuffix == true }}
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.push-containers.outputs.images }}
      sbomsArtifact: ${{ steps.push-containers.outputs.sbomsArtifact }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: strimzi/github-actions/.github/actions/dependencies/install-docker@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0

      - uses: strimzi/github-actions/.github/actions/dependencies/install-syft@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          version: "1.20.0"

      - name: Push containers using push-containers action
        id: push-containers
        uses: strimzi/github-actions/.github/actions/build/push-containers@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          architectures: "amd64,arm64,ppc64le,s390x"
          containerRegistry: "quay.io"
          containerOrg: "strimzi"
          containerTag: "${{ inputs.releaseVersion }}-${{ inputs.releaseSuffix }}"
          registryUser: ${{ secrets.QUAY_USER }}
          registryPassword: ${{ secrets.QUAY_PASS }}
          artifactSuffix: "drain-cleaner"
          buildRunId: ${{ inputs.sourceBuildRunId }}

  attest-with-suffix:
    name: Attestation (with suffix)
    needs:
      - push-containers-with-suffix
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: strimzi/github-actions/.github/workflows/reusable-attest.yml@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
    with:
      containerImages: ${{ needs.push-containers-with-suffix.outputs.images }}
      sbomsArtifact: ${{ needs.push-containers-with-suffix.outputs.sbomsArtifact }}

  push-containers:
    name: Push Containers without suffix (${{ inputs.releaseVersion }})
    needs:
      - push-containers-with-suffix
      - prepare-release-artifacts
    if: |-
      ${{ always() && startsWith(github.ref, 'refs/heads/release-') &&
        needs.prepare-release-artifacts.result == 'success' &&
        (needs.push-containers-with-suffix.result == 'success' ||
        needs.push-containers-with-suffix.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.push-containers.outputs.images }}
      sbomsArtifact: ${{ steps.push-containers.outputs.sbomsArtifact }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: strimzi/github-actions/.github/actions/dependencies/install-docker@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0

      - uses: strimzi/github-actions/.github/actions/dependencies/install-syft@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          version: "1.20.0"

      - name: Push containers using push-containers action
        id: push-containers
        uses: strimzi/github-actions/.github/actions/build/push-containers@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          architectures: "amd64,arm64,ppc64le,s390x"
          containerRegistry: "quay.io"
          containerOrg: "strimzi"
          containerTag: ${{ inputs.releaseVersion }}
          registryUser: ${{ secrets.QUAY_USER }}
          registryPassword: ${{ secrets.QUAY_PASS }}
          artifactSuffix: "drain-cleaner"
          buildRunId: ${{ inputs.sourceBuildRunId }}

  publish-helm-chart:
    name: Publish Helm Chart
    needs:
      - prepare-release-artifacts
      - push-containers
    if: |-
      ${{ always() && startsWith(github.ref, 'refs/heads/release-') &&
        needs.push-containers.result == 'success'
      }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish-helm-chart.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: strimzi/github-actions/.github/actions/dependencies/install-helm@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          helmVersion: "v3.16.0"

      - name: Publish Helm charts using publish-helm action
        id: publish-helm-chart
        uses: strimzi/github-actions/.github/actions/build/publish-helm-chart@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          registryUser: ${{ secrets.QUAY_HELM_USER }}
          registryPassword: ${{ secrets.QUAY_HELM_PASS }}
          containerRegistry: "quay.io"
          containerOrg: "strimzi-helm"
          helmChartName: "strimzi-drain-cleaner-helm-3-chart"
          releaseVersion: ${{ inputs.releaseVersion }}
          artifactSuffix: "drain-cleaner"

  attest:
    name: Attestation
    needs:
      - push-containers
      - prepare-release-artifacts
      - publish-helm-chart
    if: |-
      ${{ always() && startsWith(github.ref, 'refs/heads/release-') &&
        needs.push-containers.result == 'success'
      }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: strimzi/github-actions/.github/workflows/reusable-attest.yml@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
    with:
      containerImages: ${{ needs.push-containers.outputs.images }}
      sbomsArtifact: ${{ needs.push-containers.outputs.sbomsArtifact }}
      artifactSuffix: "drain-cleaner"
      releaseVersion: ${{ inputs.releaseVersion }}
      helmChartName: "strimzi-drain-cleaner-helm-3-chart"
      helmChartImage: ${{ needs.publish-helm-chart.outputs.image }}

  snyk-scan:
    name: Snyk Scan
    needs:
      - prepare-release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/snyk.yml
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
      sourceBuildRunId: ${{ inputs.sourceBuildRunId }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  fossa-scan:
    name: FOSSA Scan
    needs:
      - prepare-release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/fossa.yml
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
      sourceBuildRunId: ${{ inputs.sourceBuildRunId }}
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
