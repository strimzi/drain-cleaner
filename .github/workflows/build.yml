name: Build

on:
  push:
    branches:
      - "main"
      - "release-*"
  pull_request:
    branches:
      - "*"

# Declare default permissions as read only
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-drain-cleaner:
    name: Build Drain Cleaner
    strategy:
      matrix:
        # Java 21 is used as default version
        # In case of adding new version make sure that build-containers and deploy-java has correct static version set
        java:
          - version: "21"
            mainBuild: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java and Maven
        uses: strimzi/github-actions/.github/actions/dependencies/setup-java@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          javaVersion: ${{ matrix.java.version }}

      - name: Install Helm
        uses: strimzi/github-actions/.github/actions/dependencies/install-helm@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          helmVersion: "v3.20.0"
          helmUnitTestVersion: "v1.0.3"

      - name: Build binaries using build-binaries action
        uses: strimzi/github-actions/.github/actions/build/build-binaries@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          mainJavaBuild: ${{ matrix.java.mainBuild }}
          artifactSuffix: "drain-cleaner"
        env:
          MVN_ARGS: "-B -Dquarkus.native.container-build=true"

  build-containers:
    name: Build Containers
    needs:
      - build-drain-cleaner
    strategy:
      matrix:
        architecture:
          - amd64
          - arm64
          - s390x
          - ppc64le
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: strimzi/github-actions/.github/actions/dependencies/install-docker@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0

      - uses: strimzi/github-actions/.github/actions/build/build-containers@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          architecture: ${{ matrix.architecture }}
          artifactSuffix: "drain-cleaner"
          containerRegistry: "quay.io"
          containerOrg: "strimzi"
          containerTag: "latest"
          imagesLocation: "drain-cleaner-container-${{ matrix.architecture }}.tar.gz"

  run-systemtests:
    name: Run System Tests
    needs:
      - build-containers
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            installType: Bundle
            runner: ubuntu-latest
          - architecture: amd64
            installType: Helm
            runner: ubuntu-latest
          - architecture: arm64
            installType: Bundle
            runner: oracle-vm-4cpu-16gb-arm64
          - architecture: arm64
            installType: Helm
            runner: oracle-vm-4cpu-16gb-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build/run-systemtests
        with:
          architecture: ${{ matrix.architecture }}
          runnerArch: ${{ matrix.architecture }}
          installType: ${{ matrix.installType }}

  push-containers:
    name: Push Containers
    needs:
      - build-drain-cleaner
      - build-containers
      - run-systemtests
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.push-containers.outputs.images }}
      sbomsArtifact: ${{ steps.push-containers.outputs.sbomsArtifact }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: strimzi/github-actions/.github/actions/dependencies/install-docker@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0

      - uses: strimzi/github-actions/.github/actions/dependencies/install-syft@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          version: "1.57.1"

      - name: Push containers using push-containers action
        id: push-containers
        uses: strimzi/github-actions/.github/actions/build/push-containers@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          architectures: "amd64,arm64,ppc64le,s390x"
          containerRegistry: "quay.io"
          containerOrg: "strimzi"
          containerTag: "latest"
          registryUser: ${{ secrets.QUAY_USER }}
          registryPassword: ${{ secrets.QUAY_PASS }}
          artifactSuffix: "drain-cleaner"

  attest:
    name: Attestation
    needs:
      - push-containers
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: strimzi/github-actions/.github/workflows/reusable-attest.yml@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
    with:
      containerImages: ${{ needs.push-containers.outputs.images }}
      sbomsArtifact: ${{ needs.push-containers.outputs.sbomsArtifact }}

  publish-snapshot:
    name: Publish snapshot to GHCR
    needs:
      - build-drain-cleaner
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push-oci-artifact.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-drain-cleaner.tar

      - uses: strimzi/github-actions/.github/actions/dependencies/install-yq@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          version: "v4.54.3"

      - name: Get project version
        id: version
        run: echo "version=$(yq -p xml '.project.version' pom.xml)" >> "$GITHUB_OUTPUT"

      - uses: strimzi/github-actions/.github/actions/dependencies/install-oras@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          version: "1.3.6"

      - name: Push binaries to GHCR
        id: push-oci-artifact
        uses: strimzi/github-actions/.github/actions/build/push-oci-artifact@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          file: binaries-drain-cleaner.tar
          name: binaries-drain-cleaner
          tag: ${{ steps.version.outputs.version }}
